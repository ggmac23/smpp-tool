# Every push and pull request: the whole suite, the linter and the formatter.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux webview and its build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The Rust suite asserts the packaged frontend is where the config
      # says it is, so it has to exist before cargo test runs.
      - name: Build the renderer
        run: npm run build:ui

      # The renderer: types first, then the suite, then the bundle the
      # contract test reads.
      - run: npm test

      - name: Format
        run: cd src-tauri && cargo fmt --check

      - name: Lint
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cd src-tauri && cargo test
